<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons-outline.min.css">
<style>
body{margin:0;background:#F1EFE8;font-family:Roboto,Arial,sans-serif;padding:10px;display:flex;flex-wrap:wrap;gap:10px}
.w{width:320px;padding:10px;background:#F1EFE8}
.ph{background:#1B1740;border-radius:24px;padding:14px;color:#fff;font-size:13px;height:470px;border:4px solid #2C2C2A;position:relative;overflow:hidden;box-sizing:border-box}
.cd{background:#2A2560;border-radius:12px;padding:10px;margin-bottom:8px}
.bar{height:6px;background:#3C3489;border-radius:3px;margin-top:6px}.bar i{display:block;height:6px;border-radius:3px}
.mt{color:#AFA9EC;font-size:11px}
.chk{width:16px;height:16px;border-radius:5px;border:2px solid #5DCAA5;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:center}
.cap{text-align:center;font-size:13px;color:#444441;margin-top:6px}
.st{background:#2A2560;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px}
.st b{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;align-items:center;justify-content:center;font-size:20px;font-weight:400}
.num{background:#3C3489;border-radius:8px;padding:2px 8px;font-size:12px}
.fl{background:#2A2560;border:1px solid #3C3489;border-radius:10px;padding:9px 10px;margin:4px 0 10px}
.btn{background:#5DCAA5;color:#04342C;border-radius:12px;padding:10px;text-align:center}
.dot{width:24px;height:24px;border-radius:50%;display:inline-block}
.dim{position:absolute;inset:0;background:rgba(10,8,30,.65)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#2A2560;border-radius:20px 20px 0 0;padding:14px}
.nav{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-around;color:#AFA9EC;font-size:18px;align-items:center}
.fab{background:#5DCAA5;color:#04342C;border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
</style></head><body>
<!-- Каждый экран — блок <div class="w" id="NN_name"><div class="ph">…</div><div class="cap">NN. Подпись</div></div>. Классы: .ph телефон, .cd карточка, .mt мелкий текст, .row строка, .btn кнопка, .chk чекбокс, .sheet панель снизу, .dim затемнение. -->

</body></html>
