<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чекпоинт — живая заставка</title>
<style>
:root{--bg:#F3F2EE;--ink:#1E1B3A;--muted:#6B6890}
body{margin:0;background:var(--bg);font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{font-weight:500;font-size:20px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 16px;text-align:center;max-width:520px}
.phone{width:330px;height:660px;border-radius:44px;background:#1B1740;border:8px solid #0F0D24;box-shadow:0 20px 60px rgba(20,16,60,.35);position:relative;overflow:hidden}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:12px;background:#0F0D24}
svg{position:absolute;left:15%;top:150px;width:70%;height:auto;overflow:visible}
.title{position:absolute;left:0;right:0;top:404px;text-align:center;color:#fff;font-size:32px;letter-spacing:.5px;opacity:0}
.slogan{position:absolute;left:0;right:0;top:450px;text-align:center;color:#AFC3FF;font-size:15px;opacity:0}
.proto{position:absolute;left:50%;top:560px;transform:translateX(-50%);border:1px solid #FAC775;color:#FAC775;border-radius:8px;padding:4px 12px;font-size:11px;letter-spacing:1.5px;opacity:0}
.hint{position:absolute;left:0;right:0;top:600px;text-align:center;color:#8E89C4;font-size:11px;opacity:0}
.slab{fill:var(--slab)} .face{fill:url(#grad)} .hl{fill:url(#hl)}
.ctl{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:13px;border:1px solid #CFCBE6;background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
button.on{background:#1E1B3A;color:#fff;border-color:#1E1B3A}
</style></head><body>
<h1>Живая заставка «Чекпоинт»</h1>
<p class="sub">Флагшток вырастает, кубики-задачи встают в ряды, последний влетает на место — флаг цели готов. ~1,6 секунды. При «уменьшить движение» — сразу готовый знак.</p>
<div class="phone" id="phone"><div class="notch"></div>
<svg viewBox="236 226 600 600" id="mark">
<defs>
<linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="350" y1="600" x2="760" y2="300"><stop offset="0" id="s0"/><stop offset=".38" id="s1"/><stop offset=".68" id="s2"/><stop offset="1" id="s3"/></linearGradient>
<linearGradient id="poleg" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="760"><stop offset="0" stop-color="#3F8CFF"/><stop offset="1" stop-color="#3B5BFF"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" id="g0" stop-opacity=".55"/><stop offset="1" id="g1" stop-opacity="0"/></radialGradient>
</defs>
<g transform="translate(534 532) scale(1.02) translate(-512 -512)">
<circle id="pulse" cx="560" cy="440" r="260" fill="url(#glow)" opacity="0"/>
<g id="pole" style="transform-origin:331px 752px;transform-box:view-box"><rect x="318" y="300" width="26" height="452" rx="13" fill="url(#poleg)"/></g>
<circle id="fin" cx="331" cy="294" r="24" style="transform-origin:331px 294px;transform-box:view-box"/>
<g id="cloth"><g class="tile" data-k="0" data-tip="0" style="transform-origin:404.0px 357.2px;transform-box:view-box"><rect class="slab" x="367.0" y="325.3" width="84.0" height="84.0" rx="22.7"/><rect class="face" x="362" y="315.2" width="84.0" height="84.0" rx="22.7"/><rect class="hl" x="368.7" y="320.2" width="70.6" height="42.0" rx="18.1"/></g><g class="tile" data-k="1" data-tip="0" style="transform-origin:404.0px 455.2px;transform-box:view-box"><rect class="slab" x="367.0" y="423.3" width="84.0" height="84.0" rx="22.7"/><rect class="face" x="362" y="413.2" width="84.0" height="84.0" rx="22.7"/><rect class="hl" x="368.7" y="418.2" width="70.6" height="42.0" rx="18.1"/></g><g class="tile" data-k="2" data-tip="0" style="transform-origin:404.0px 553.2px;transform-box:view-box"><rect class="slab" x="367.0" y="521.3" width="84.0" height="84.0" rx="22.7"/><rect class="face" x="362" y="511.2" width="84.0" height="84.0" rx="22.7"/><rect class="hl" x="368.7" y="516.2" width="70.6" height="42.0" rx="18.1"/></g><g class="tile" data-k="3" data-tip="0" style="transform-origin:500.55px 372.15000000000003px;transform-box:view-box"><rect class="slab" x="464.9" y="341.3" width="81.1" height="81.1" rx="21.9"/><rect class="face" x="460.0" y="331.6" width="81.1" height="81.1" rx="21.9"/><rect class="hl" x="466.5" y="336.5" width="68.1" height="40.5" rx="17.5"/></g><g class="tile" data-k="4" data-tip="0" style="transform-origin:500.55px 467.25px;transform-box:view-box"><rect class="slab" x="464.9" y="436.4" width="81.1" height="81.1" rx="21.9"/><rect class="face" x="460.0" y="426.7" width="81.1" height="81.1" rx="21.9"/><rect class="hl" x="466.5" y="431.6" width="68.1" height="40.5" rx="17.5"/></g><g class="tile" data-k="5" data-tip="0" style="transform-origin:500.55px 562.25px;transform-box:view-box"><rect class="slab" x="464.9" y="531.4" width="81.1" height="81.1" rx="21.9"/><rect class="face" x="460.0" y="521.7" width="81.1" height="81.1" rx="21.9"/><rect class="hl" x="466.5" y="526.6" width="68.1" height="40.5" rx="17.5"/></g><g class="tile" data-k="6" data-tip="0" style="transform-origin:594.15px 371.85px;transform-box:view-box"><rect class="slab" x="559.8" y="342.2" width="78.1" height="78.1" rx="21.1"/><rect class="face" x="555.1" y="332.8" width="78.1" height="78.1" rx="21.1"/><rect class="hl" x="561.3" y="337.5" width="65.6" height="39.0" rx="16.9"/></g><g class="tile" data-k="7" data-tip="0" style="transform-origin:594.15px 463.95px;transform-box:view-box"><rect class="slab" x="559.8" y="434.3" width="78.1" height="78.1" rx="21.1"/><rect class="face" x="555.1" y="424.9" width="78.1" height="78.1" rx="21.1"/><rect class="hl" x="561.3" y="429.6" width="65.6" height="39.0" rx="16.9"/></g><g class="tile" data-k="8" data-tip="1" style="transform-origin:684.8000000000001px 448.70000000000005px;transform-box:view-box"><rect class="slab" x="651.7" y="420.1" width="75.2" height="75.2" rx="20.3"/><rect class="face" x="647.2" y="411.1" width="75.2" height="75.2" rx="20.3"/><rect class="hl" x="653.2" y="415.6" width="63.2" height="37.6" rx="16.2"/></g></g>
</g></svg>
<div class="title" id="title">Чекпоинт</div><div class="slogan" id="slogan">Ставь цели. Закрывай задачи.</div>
<div class="proto" id="proto">ПРОТОТИП</div><div class="hint" id="hint">Коснись, чтобы продолжить</div>
</div>
<div class="ctl"><button id="replay">▶ Повторить</button><button data-st="ultra" class="on">Ультрамарин</button><button data-st="aurora">Аврора</button><button data-st="holo">Голограмма</button><button id="slow">Медленно ×3</button></div>
<script>
const ST={aurora:['#2433F5','#7B3FF2','#F0469E','#FFB13B','#3A1890','#F0469E'],ultra:['#2433F5','#1F7CF4','#1EA9F2','#1EC8F2','#1622A8','#1EC8F2'],holo:['#00C2FF','#7B5CFF','#FF4FD8','#FFE45C','#3A1890','#7B5CFF']};
function setStyle(n){const c=ST[n];['s0','s1','s2','s3'].forEach((id,i)=>document.getElementById(id).setAttribute('stop-color',c[i]));
document.documentElement.style.setProperty('--slab',c[4]);document.getElementById('fin').setAttribute('fill',c[3]);
['g0','g1'].forEach(id=>document.getElementById(id).setAttribute('stop-color',c[5]));
document.querySelectorAll('[data-st]').forEach(b=>b.classList.toggle('on',b.dataset.st===n));}
let speed=1;
function build(){
  document.getAnimations().forEach(a=>a.cancel());
  const A=[];const sp=t=>t*speed;const spring='cubic-bezier(.34,1.56,.64,1)';
  A.push(document.getElementById('pole').animate([{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:sp(320),easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'}));
  A.push(document.getElementById('fin').animate([{transform:'scale(0)'},{transform:'scale(1.25)',offset:.7},{transform:'scale(1)'}],{duration:sp(260),delay:sp(260),easing:'ease-out',fill:'both'}));
  const tiles=[...document.querySelectorAll('.tile')];
  tiles.forEach(el=>{const k=+el.dataset.k;const tip=el.dataset.tip==='1';
    if(!tip){A.push(el.animate([{opacity:0,transform:'translateY(-26px) scale(.55)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:sp(380),delay:sp(380+k*70),easing:spring,fill:'both'}));}
    else{A.push(el.animate([{opacity:0,transform:'translate(150px,-170px) rotate(40deg) scale(.8)'},{opacity:1,transform:'translate(20px,-24px) rotate(8deg) scale(1.02)',offset:.7},{opacity:1,transform:'translate(0,0) rotate(0) scale(1)'}],{duration:sp(460),delay:sp(380+8*70+40),easing:'cubic-bezier(.3,.7,.3,1)',fill:'both'}));}
  });
  const land=380+8*70+40+460;
  // wave ripple through cloth after landing
  tiles.forEach(el=>{const c=+el.closest('.tile').querySelector('.face').getAttribute('x');const d=(c-360)/400*220;
    A.push(el.animate([{translate:'0 0'},{translate:'0 -9px'},{translate:'0 0'}],{duration:sp(320),delay:sp(land+d),easing:'ease-in-out',composite:'add'}));});
  A.push(document.getElementById('pulse').animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1)',offset:.35},{opacity:0,transform:'scale(1.15)'}],{duration:sp(700),delay:sp(land-60),easing:'ease-out',fill:'both'}));
  const fade=(id,dl,dy=10)=>A.push(document.getElementById(id).animate([{opacity:0,translate:`0 ${dy}px`},{opacity:1,translate:'0 0'}],{duration:sp(420),delay:sp(dl),easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'}));
  fade('title',land-80);fade('slogan',land+60);fade('proto',land+220,0);fade('hint',land+700,0);
  window.__total=(land+700+420)*speed;return A;}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){speed=0.0001;}
setStyle('ultra');let anims=build();
document.getElementById('replay').onclick=()=>{anims=build();};
document.getElementById('phone').onclick=()=>{anims=build();};
document.getElementById('slow').onclick=e=>{speed=speed===1?3:1;e.target.classList.toggle('on',speed===3);anims=build();};
document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{setStyle(b.dataset.st);anims=build();});
// for frame capture
window.__seek=(t)=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=t;});};
</script></body></html>
