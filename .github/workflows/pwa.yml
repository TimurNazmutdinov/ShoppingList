name: PWA

# Веб-версия (PWA для iPhone): при каждом обновлении ветки pwa (с main не сливается никогда) собирается и кладётся в папку app/
# репозитория TimurNazmutdinov/ShoppingList-android-apk (GitHub Pages: ветка main, корень).
# Адрес: https://timurnazmutdinov.github.io/ShoppingList-android-apk/app/
# Один раз: создать fine-grained токен (репозиторий ShoppingList-android-apk, Contents: Read and write)
# и добавить его в этот репозиторий как секрет PAGES_DEPLOY_TOKEN (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [pwa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-web.js /ShoppingList-android-apk/app
      - uses: actions/checkout@v4
        with:
          repository: TimurNazmutdinov/ShoppingList-android-apk
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages
      - name: Publish to pages/app
        run: |
          rm -rf pages/app
          mkdir -p pages/app
          cp -r dist-web/. pages/app/
          touch pages/.nojekyll
          cd pages
          git config user.name "pwa-deploy"
          git config user.email "pwa-deploy@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "PWA: ${GITHUB_SHA::7}"
            git push
          fi
