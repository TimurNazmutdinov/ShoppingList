name: PWA

# Веб-версия (PWA для iPhone): при каждом обновлении ветки pwa (с main не сливается никогда) собирается и кладётся в папку app/
# репозитория quiteusefulapp/smart-shopping-list (GitHub Pages: ветка main, корень).
# Адрес: https://quiteusefulapp.github.io/smart-shopping-list/app/
# Доступ — ключ выкладки (deploy key): приватная часть в секрете PAGES_DEPLOY_KEY этого репозитория,
# публичная добавлена в quiteusefulapp/smart-shopping-list → Settings → Deploy keys (Allow write access).
on:
  push:
    branches: [pwa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-web.js /smart-shopping-list/app
      - uses: actions/checkout@v4
        with:
          repository: quiteusefulapp/smart-shopping-list
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages
      - name: Publish to pages/app
        run: |
          rm -rf pages/app
          mkdir -p pages/app
          cp -r dist-web/. pages/app/
          cd pages
          git config user.name "pwa-deploy"
          git config user.email "pwa-deploy@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "PWA: ${GITHUB_SHA::7}"
            git push
          fi
